{
	"_help": "dirt_shift configuration. Shared values (the timer file path and the battery's cell count) are read from zeroinput.conf — not duplicated here. This file holds only the path to zeroinput.conf and the dirt_shift-specific parameters. SMARD day-ahead grid data is a prerequisite: if its fetch fails, cached data substitutes for one more day, after which dirt_shift aborts and leaves an all-allowed timer.",
	"zeroinput_conf": "../zeroinput.conf",
	"zeroinput_conf_help": "path to zeroinput.conf (dirt_shift usually lives in a subfolder of zeroinput). discharge_t_file (the timer path) is read from there.",
	"vz_host_port": "192.168.1.10:8080",
	"vz_host_port_help": "volkszähler host:port for the data.json API (dirt_shift uses the HTTP API, separate from zeroinput's vzlogger FIFO).",
	"vz_chans": {
		"Inverter": "00000000-0000-0000-0000-000000000001",
		"Import": "00000000-0000-0000-0000-000000000002",
		"Auto": "00000000-0000-0000-0000-000000000003",
		"PV": "00000000-0000-0000-0000-000000000006",
		"Vbat": "00000000-0000-0000-0000-000000000007"
	},
	"vz_chans_help": "volkszähler channel UUIDs. basic_load consumption = Import + |Inverter| - Auto (adapt the formula in get_average and this channel set to your own installation). PV and Vbat are used for the red window and battery content.",
	"vz_dirtiness_uuid": "",
	"vz_dirtiness_uuid_help": "optional: real volkszähler channel UUID (created in volkszähler beforehand) for the current grid dirtiness value. dirt_shift POSTs the value directly to volkszähler's middleware API once per run — http://{vz_host_port}/data/{this UUID}.json — no vzlogger meter or local file involved. Sign convention matches the installation's existing power channels (Import positive = drawing from the grid, Inverter negative = feeding in): positive = dirtier (below-average renewable share), negative = cleaner than average / renewable surplus. Empty disables the write.",
	"average_days": 7,
	"average_days_help": "days of history for the hourly basic_load/PV average. 7 = one full week structure. Cached hourly in dirt_avg_cache.json.",
	"day_weights_pct": [
		200,
		100,
		100,
		100,
		100,
		150,
		200
	],
	"day_weights_pct_help": "per-day weighting (percent) for the average, chronological: index 0 = oldest day (today minus average_days, i.e. same weekday last week), index -1 = yesterday. Weighting yesterday and last week's same weekday higher captures recent trend and weekday structure. Length must equal average_days; on mismatch all days are weighted equally. All 100 = neutral. In the web form, edit as a comma-separated list.",
	"reserve_pct": 90,
	"reserve_pct_help": "percent of the demand to hold back as the red reserve, taken as max(red_window_demand, upcoming_red_demand): the first sums every red hour between now and the next PV surplus phase, the second the next contiguous red block even across a surplus, minus the surplus expected before that block begins (surplus_before_next_red) — the second is the floor that keeps the reserve from reading 0 while now sits inside a surplus stretch, while the subtraction keeps it from holding the battery idle through a morning whose own yield already covers the gap. ~90 so the reserve is nearly used up by the time PV production resumes. Values above 100 are allowed and make the reserve itself more cautious. Also scales the quarter-hour energy budget of non-priority red hours (see limit_discharge_rate_help), where it is capped at 100% — above that a cap would exceed the hour's own net demand and stop restricting anything — and the wallbox-specific reserve check, which uses the same max() (see wallbox_typical_power_help).",
	"limit_discharge_rate": 3000,
	"limit_discharge_rate_help": "Watt cap on battery discharge power during a non-priority red hour (content below reserve, this hour not the dirtiest in the window) — installation-specific, adapt to the ordinary peak load of your own house. Applies together with a fixed quarter-hour energy budget (1/4 * (min(1, reserve_pct) * basic_load - measured PV), floored at 0, not configurable — scaled by reserve_pct like the reserve calculation itself, but netted against the PV actually measured over the last 15 minutes rather than the forecast's hourly mean, which is too coarse on the ramp hours that are routinely the marginal red ones): the rate cap alone would still let a small but sustained excess load through over the full hour, the energy budget alone would still let a brief high-power spike through. Set very high to make the rate cap effectively unrestricted, leaving only the energy budget in effect.",
	"latitude": 51.0,
	"longitude": 10.0,
	"PV_to_bat_efficiency": 98,
	"bat_to_AC_efficiency": 90,
	"max_days_empty_battery": 7,
	"max_days_empty_battery_help": "how many days back to search for a 'battery empty' state (voltage <= 49 V) as the integration anchor.",
	"disable_zeroinput_timer": false,
	"disable_zeroinput_timer_help": "set true to compute and print without writing the timer file (dry run).",
	"logfile": "",
	"logfile_help": "optional path to a logfile that mirrors every console print — empty disables it. Setting this alone already forces verbose output (as if -v were passed), console output included, since a configured logfile is itself the request for the verbose record; -debug on the command line still adds the hourly table on top. Resolved relative to dirt_shift.py's directory unless absolute. Opened in append mode, one run after another with a timestamp line between them; dirt_shift never rotates or truncates it itself, so an external tool (e.g. logrotate) should if it is left on permanently. A logfile that can't be opened or written only prints a warning — it never blocks writing timer.txt.",
	"latitude_help": "decimal degrees (north) of the installation, for the clear-sky irradiance model (clear_sky_ghi) and the Open-Meteo radiation forecast. Default ~centre of Germany.",
	"longitude_help": "decimal degrees (east) of the installation, for the same clear-sky model and radiation forecast. Default ~centre of Germany.",
	"PV_to_bat_efficiency_help": "percent efficiency PV -> battery, used to reconstruct the real battery energy content (see get_vz_bat_cap).",
	"bat_to_AC_efficiency_help": "percent efficiency battery -> AC/inverter, used the same way as PV_to_bat_efficiency.",
	"precharge_enabled": false,
	"precharge_enabled_help": "optional and off by default: while true, in the single cleanest green hour of the window (see cleanest_green_hour), dirt_shift may cap the timer's ac_% below 100 to divert PV surplus that would otherwise go to pvpt into the battery instead — the one deliberate exception to dirt_shift's pvpt-is-always-guaranteed rule. Only engages when diverting is actually worth it: the dirt% spread to the dirtiest red hour content does not yet cover must exceed the round-trip loss (100 - PV_to_bat_efficiency * bat_to_AC_efficiency / 100), and the reserve must be genuinely unreachable through natural surplus alone. See precharge_ac_pct and 'Discharge by zone' in the spec.",
	"wallbox_enabled": false,
	"wallbox_enabled_help": "optional and off by default: while true, dirt_shift switches an EV wallbox's Tasmota relay on during sufficiently clean hours and off again outside them, but only ever switches off a relay it switched on itself (see the owner marker, dirt_wallbox_marker.json) — a manual activation is never undone by dirt_shift, whatever the grid does; once dirt_shift itself sets the relay on during a later clean hour, it is treated as its own from then on. Three independent conditions switch it on (any one suffices, all three must fail to switch it off): the two dirtiness thresholds below (in a discharge mode where the battery cannot lose out by it: free, or stop with no PV surplus that hour — under stop the battery cannot be discharged at all, so the car simply charges from the grid in the cleanest hour, which is the point), enough battery content against a wallbox-specific reserve (see wallbox_typical_power_help), or a full battery — voltage not having dropped below WALLBOX_V_ON_PER_CELL over the last quarter hour, so otherwise wasted PV surplus goes into the car (named constants in the code, scaled by cell_count, with a lower holding threshold as hysteresis). No presence/charging detection is used: the relay is simply held closed whenever the hour qualifies, on-command verified via Tasmota's own relay status (up to 3 attempts, 30 s apart) before the marker is set.",
	"wallbox_ip": "",
	"wallbox_ip_help": "IP address of the Tasmota device controlling the wallbox relay.",
	"wallbox_output": "1",
	"wallbox_output_help": "Tasmota relay/output number (Power1, Power2, ...) — '1' for a single-relay device's first (usually only) output.",
	"wallbox_cleanest_pct": 30,
	"wallbox_cleanest_pct_help": "the wallbox may only be on while the current hour ranks among the cleanest this-many percent of the rolling 24-hour window (default 30 = only the cleanest 30% of hours). A rank, not a share of the median: dirt% is signed and goes negative whenever renewables exceed load, so a percentage of it would mean something different on every day — from letting nothing through on a uniformly dirty day to letting most of the window through on a windy one. As a rank the setting always admits exactly that share of hours. Works together with wallbox_absolute_max, which stays an absolute ceiling.",
	"wallbox_absolute_max": 50,
	"wallbox_absolute_max_help": "the wallbox may only be on while the current hour's dirt% is at or below this absolute value (default 50) — prevents wallbox_cleanest_pct alone from still allowing a meaningfully dirty hour on a uniformly dirty day (high median). Both this and wallbox_cleanest_pct must hold (AND, not OR).",
	"wallbox_typical_power": 2000,
	"wallbox_typical_power_help": "typical wallbox charging power in Watt, used only to project ahead for the energy safety net (see wallbox_decide): one margin is wallbox_typical_power * SLOT_HOURS, a single slot's worth of draw, and (content - headroom) is compared against a reserve computed exactly as the main one is, max(red_window_demand, upcoming_red_demand) — the wallbox is never held to a lower bar than the battery it draws from — both to decide whether a comfortably full battery may start the wallbox even outside the dirt% thresholds, and to decide when a currently-running (dirt_shift-owned) wallbox must be switched off before it would eat into the reserve. Switching on demands WALLBOX_ENERGY_ON_FACTOR margins of headroom, holding only one (hysteresis: a switch-on decided on less than one run of draw would be undone by its own consequence at the next run). Does not need to match the real charging current exactly — it is a safety margin, not a metered value."
}
